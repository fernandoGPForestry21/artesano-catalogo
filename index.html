<style>
/* Visor vertical del catálogo: una página cuadrada tras otra, centradas, sobre fondo cacao. */
:root { --bg: #2B1A10; --fg: #F4EAD6; --muted: #C9B596; --gold: #D9B65F; color-scheme: dark; }
body { background: var(--bg); color: var(--fg); font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 40px; }

header h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 600; font-size: clamp(1.5rem, 5vw, 2rem); letter-spacing: 0.08em; text-transform: uppercase; margin: 0; color: var(--gold); text-wrap: balance; }
header p { margin: 6px 0 0; color: var(--muted); font-size: 0.92rem; }
.pages { display: flex; flex-direction: column; gap: 16px; }
.pages img { display: block; width: 100%; max-width: 100%; aspect-ratio: 1 / 1; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,0.35); background: #E9E1DA; }
footer { text-align: center; color: var(--muted); font-size: 0.9rem; margin-top: 24px; line-height: 1.7; }
footer strong { color: var(--fg); font-weight: 600; }
.ig { display: inline-block; margin-top: 14px; padding: 11px 22px; border-radius: 999px; background: var(--gold); color: #2A1A0E; font-weight: 600; text-decoration: none; }
.ig:hover { filter: brightness(1.08); }
.ig:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
footer a.txt { color: var(--fg); font-weight: 600; }
body{margin:0}
header .ig{margin-inline:4px}
</style>
